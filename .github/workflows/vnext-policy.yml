name: vNext Policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Reject unresolved merge markers
        run: node --experimental-strip-types scripts/check-merge-markers.ts

      - name: Require source provenance
        run: test -s docs/SOURCE_PROVENANCE.md
